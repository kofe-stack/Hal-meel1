name: HalMeel - Expo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: halmeel-android-build
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Expo project
        run: |
          test -f package.json
          test -f app.json || test -f app.config.js || test -f app.config.ts
          test -f eas.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check Expo configuration
        run: npx expo config --type public

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing EXPO_TOKEN repository secret."
            exit 1
          fi
          eas whoami

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Find completed APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json > build.json

          node -e '
            const fs = require("fs");
            const builds = JSON.parse(fs.readFileSync("build.json", "utf8"));
            const url = builds[0]?.artifacts?.buildUrl;
            if (!url) {
              console.error("APK download URL not found.");
              process.exit(1);
            }
            fs.writeFileSync("apk-url.txt", url);
          '

      - name: Download APK
        run: |
          mkdir -p apk
          curl --fail --location --retry 5 \
            "$(cat apk-url.txt)" \
            --output apk/HalMeel.apk
          test -s apk/HalMeel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalMeel-Android-APK
          path: apk/HalMeel.apk
          if-no-files-found: error
          retention-days: 30
