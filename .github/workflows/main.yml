
name: HalMeel - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: halmeel-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check project files
        shell: bash
        run: |
          set -e

          test -f package.json || {
            echo "ERROR: package.json is missing from repository root."
            exit 1
          }

          test -f eas.json || {
            echo "ERROR: eas.json is missing from repository root."
            exit 1
          }

          if [ ! -f app.json ] && \
             [ ! -f app.config.js ] && \
             [ ! -f app.config.ts ] && \
             [ ! -f app.config.mjs ] && \
             [ ! -f app.config.cjs ]; then
            echo "ERROR: Expo app configuration is missing."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret is missing."
            exit 1
          fi

          eas whoami

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait

      - name: Find APK download URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -e

          eas build:list \
            --platform android \
            --status finished \
            --limit 1 \
            --json > build.json

          node <<'NODE'
          const fs = require("fs");
          const builds = JSON.parse(
            fs.readFileSync("build.json", "utf8")
          );

          const url = builds[0]?.artifacts?.buildUrl;

          if (!url) {
            console.error("ERROR: APK URL not found in EAS build results.");
            process.exit(1);
          }

          fs.writeFileSync("apk-url.txt", url);
          NODE

      - name: Download APK
        shell: bash
        run: |
          set -e
          mkdir -p apk

          curl --fail --location --retry 5 \
            --retry-delay 3 \
            "$(cat apk-url.txt)" \
            --output apk/HalMeel.apk

          test -s apk/HalMeel.apk

          if [ "$(od -An -tx1 -N2 apk/HalMeel.apk | tr -d ' \n')" != "504b" ]; then
            echo "ERROR: Downloaded file does not look like an APK ZIP archive."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HalMeel-Android-APK
          path: apk/HalMeel.apk
          if-no-files-found: error
          retention-days: 30
