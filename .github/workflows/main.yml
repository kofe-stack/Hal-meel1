
name: HalMeel Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: halmeel-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check project files
        shell: bash
        run: |
          set -e
          test -f package.json
          test -f eas.json

          if [ ! -f app.json ] && \
             [ ! -f app.config.js ] && \
             [ ! -f app.config.ts ] && \
             [ ! -f app.config.mjs ] && \
             [ ! -f app.config.cjs ]; then
            echo "Expo configuration file is missing."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Check Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing."
            echo "Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          eas whoami

      - name: Build APK and save build URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -e

          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json > eas-build.json

          node <<'NODE'
          const fs = require("fs");
          const raw = fs.readFileSync("eas-build.json", "utf8");
          const data = JSON.parse(raw);
          const build = Array.isArray(data) ? data[0] : data;

          const url = build?.artifacts?.buildUrl;
          const status = build?.status;

          if (status && status !== "FINISHED") {
            console.error("EAS build status:", status);
            process.exit(1);
          }

          if (!url) {
            console.error("APK URL not found in EAS build output.");
            process.exit(1);
          }

          fs.writeFileSync("apk-url.txt", url);
          console.log("Build finished. APK URL saved.");
          NODE

      - name: Download APK
        shell: bash
        run: |
          set -e
          mkdir -p apk

          curl --fail --location --retry 5 \
            --retry-delay 3 \
            "$(cat apk-url.txt)" \
            --output apk/HalMeel.apk

          test -s apk/HalMeel.apk

          if [ "$(od -An -tx1 -N2 apk/HalMeel.apk | tr -d ' \n')" != "504b" ]; then
            echo "Downloaded file is not a valid APK archive."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HalMeel-Android-APK
          path: apk/HalMeel.apk
          if-no-files-found: error
          retention-days: 30
          
